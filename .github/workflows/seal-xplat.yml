name: seal-xplat

# Cross-platform verification of the sealed urllib3 1.26.x build.
# Runs the REAL upstream test suite (noxfile.py `test` session -> the full
# `test/` tree) on macOS, Windows and Linux. Nothing is masked and nothing is
# deselected: the suite runs whole and its exit code alone decides the leg, so
# a green leg means every test genuinely passed on that OS + Python.

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        # Quoted so 3.10 is not parsed as the float 3.1.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-22.04, macos-15, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: dev-requirements.txt installs trustme from a pinned
          # git commit, so a complete git checkout must be available.
          fetch-depth: 0

      # MatteoH2O1999/setup-python, not actions/setup-python: actions/python-versions
      # has no darwin-arm64 CPython 3.9 build, so actions/setup-python cannot
      # provision 3.9 on macos-15 (arm64) and that leg would have to be excluded.
      # This action falls back to building the interpreter from source, keeping the
      # full python-version x os matrix runnable.
      - name: Set up Python ${{ matrix.python-version }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      - name: Install nox
        run: python -m pip install --upgrade pip setuptools nox

      # noxfile.py: session `test` -> tests_impl() installs
      # `-r dev-requirements.txt` + `.[socks,secure,brotli]` and runs pytest
      # over the whole `test/` tree (its default posargs).
      # --error-on-missing-interpreters makes a missing interpreter a hard
      # failure instead of a silently skipped session.
      - name: Run the urllib3 test suite
        env:
          # Resolve the test/runtime dependency graph as of the 1.26.20 release
          # date, exactly like the Linux Docker build does. The `secure` extra
          # only pins `pyOpenSSL>=0.14`, so an unconstrained index resolves a
          # present-day pyOpenSSL whose extra `X509.get_subject is deprecated`
          # DeprecationWarning breaks the exact-warning assertions in
          # test/contrib/test_pyopenssl.py. Scoped to this step so pip,
          # setuptools and nox themselves stay current. `trustme` comes from a
          # pinned git URL in dev-requirements.txt and is unaffected.
          PIP_INDEX_URL: https://:2024-08-29@time-machines-pypi.sealsecurity.io/
        run: nox -s test-${{ matrix.python-version }} --error-on-missing-interpreters
